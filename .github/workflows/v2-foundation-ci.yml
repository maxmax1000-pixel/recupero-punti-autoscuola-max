name: V2 Foundation CI

on:
  push:
    branches:
      - codex/recupero-punti-v2-foundation
      - codex/recupero-punti-v2-pilot-comparison
      - codex/recupero-punti-v2-clickable-statements
    paths:
      - "v2/**"
      - ".github/workflows/v2-foundation-ci.yml"

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test E2E
        run: npm run test:e2e

      - name: Upload pilot comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pilot-comparison-screenshots
          path: v2/artifacts/pilot-comparison-*.png
          if-no-files-found: error

      - name: Upload intro03 clickable statements screenshots
        uses: actions/upload-artifact@v4
        with:
          name: intro03-clickable-statements-screenshots
          path: v2/artifacts/intro03-*.png
          if-no-files-found: error

      - name: Build static preview
        run: npx vite build --base=./ --outDir dist-publish --emptyOutDir

      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: v2-preview-dist
          path: v2/dist-publish/**
          if-no-files-found: error

      - name: Publish approved V2 preview to main
        if: github.event.head_commit.message == 'Pubblica V2 approvata slide pilota'
        working-directory: .
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/v2-publish"
          main_worktree="$RUNNER_TEMP/main-worktree"
          rm -rf "$publish_root" "$main_worktree"
          mkdir -p "$publish_root"
          cp -R v2/dist-publish/. "$publish_root/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach "$main_worktree" origin/main

          rm -rf "$main_worktree/v2-preview"
          mkdir -p "$main_worktree/v2-preview"
          cp -R "$publish_root/." "$main_worktree/v2-preview/"

          git -C "$main_worktree" add v2-preview
          if git -C "$main_worktree" diff --cached --quiet; then
            echo "Preview already up to date"
            exit 0
          fi

          git -C "$main_worktree" commit -m "Pubblica anteprima V2 slide pilota"
          git -C "$main_worktree" push origin HEAD:main
