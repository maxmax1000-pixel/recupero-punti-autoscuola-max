name: V2 Foundation CI

on:
  push:
    branches:
      - codex/recupero-punti-v2-foundation
      - codex/recupero-punti-v2-pilot-comparison
    paths:
      - "v2/**"
      - ".github/workflows/v2-foundation-ci.yml"

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test E2E
        run: npm run test:e2e

      - name: Upload pilot comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pilot-comparison-screenshots
          path: v2/artifacts/pilot-comparison-*.png
          if-no-files-found: error
