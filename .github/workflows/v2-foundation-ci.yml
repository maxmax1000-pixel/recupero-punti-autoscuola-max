name: V2 Foundation CI

on:
  push:
    branches:
      - codex/recupero-punti-v2-foundation
      - codex/recupero-punti-v2-pilot-comparison
      - codex/recupero-punti-v2-clickable-statements

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate complete-program sync package
        run: node scripts/validate-legacy-publish.mjs

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test E2E
        run: npm run test:e2e

      - name: Upload pilot comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pilot-comparison-screenshots
          path: v2/artifacts/pilot-comparison-*.png
          if-no-files-found: error

      - name: Upload intro03 clickable statements screenshots
        uses: actions/upload-artifact@v4
        with:
          name: intro03-clickable-statements-screenshots
          path: v2/artifacts/intro03-*.png
          if-no-files-found: error

      - name: Upload intro04 reveal question screenshots
        uses: actions/upload-artifact@v4
        with:
          name: intro04-reveal-question-screenshots
          path: v2/artifacts/intro04-*.png
          if-no-files-found: error

      - name: Upload observation screenshots
        uses: actions/upload-artifact@v4
        with:
          name: intro05-observation-screenshots
          path: v2/artifacts/intro05-observation-*.png
          if-no-files-found: error

      - name: Upload sense civico screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sense-civico-screenshots
          path: v2/artifacts/sense-civico-*.png
          if-no-files-found: error

      - name: Upload prevenzione urgenza screenshots
        uses: actions/upload-artifact@v4
        with:
          name: prevenzione-urgenza-screenshots
          path: v2/artifacts/prevenzione-urgenza-*.png
          if-no-files-found: error

      - name: Build static preview
        run: npx vite build --base=./ --outDir dist-publish --emptyOutDir

      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: v2-preview-dist
          path: v2/dist-publish/**
          if-no-files-found: error

      - name: Publish approved V2 and complete program
        if: startsWith(github.event.head_commit.message, 'Pubblica V2 approvata')
        working-directory: .
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/v2-publish"
          main_worktree="$RUNNER_TEMP/main-worktree"
          rm -rf "$publish_root" "$main_worktree"
          mkdir -p "$publish_root"
          cp -R v2/dist-publish/. "$publish_root/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach "$main_worktree" origin/main

          rm -rf "$main_worktree/v2-preview"
          mkdir -p "$main_worktree/v2-preview"
          cp -R "$publish_root/." "$main_worktree/v2-preview/"
          cp 01_CODEX_START_HERE.md "$main_worktree/01_CODEX_START_HERE.md"

          node v2/scripts/sync-legacy-publish.mjs \
            v2/legacy-publish \
            "$main_worktree" \
            "${GITHUB_SHA:0:12}"

          printf '{"sourceCommit":"%s","publishedAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$main_worktree/publish-status.json"

          git -C "$main_worktree" add -A
          if git -C "$main_worktree" diff --cached --quiet; then
            echo "V2 e programma completo sono già aggiornati"
            exit 0
          fi

          git -C "$main_worktree" commit -m "Pubblica V2 e sincronizza programma completo"
          git -C "$main_worktree" push origin HEAD:main
